<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 360px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 14px; background-color: #f7f8fa; color: #222; box-sizing: border-box; }
    h3 { margin: 0 0 10px; font-size: 15px; text-align: center; color: #444; }
    label { font-size: 12px; color: #555; }
    label.sub { display: block; margin-top: 8px; font-size: 11px; color: #777; }
    textarea { width: 100%; height: 110px; box-sizing: border-box; margin-top: 4px; font-size: 11px; font-family: monospace; padding: 6px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
    input[type="text"] { width: 100%; box-sizing: border-box; margin-top: 3px; padding: 7px; border: 1px solid #ccc; border-radius: 4px; font-size: 11px; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    button { flex: 1; padding: 9px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; background-color: #007bff; color: white; }
    button:hover { background-color: #0056b3; }
    button.secondary { background-color: #6c757d; }
    button.secondary:hover { background-color: #545b62; }
    button.green { background-color: #28a745; }
    button.green:hover { background-color: #1e7e34; }
    select { padding: 7px; border: 1px solid #ccc; border-radius: 4px; font-size: 11px; }
    .check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #333; }
    hr { border: none; border-top: 1px solid #ddd; margin: 14px 0 8px; }
    #status, #n8nStatus { margin-top: 8px; font-size: 11px; color: #555; }
    #log { margin-top: 6px; font-size: 10px; color: #444; background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 6px; height: 70px; overflow: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h3>Infobip Automator</h3>

  <label>Links dos relatórios (um por linha, opcional: link | telefone):</label>
  <textarea id="links" placeholder="https://portal-ny2.infobip.com/... | 5511999999999"></textarea>
  <div class="row">
    <button id="saveBtn">Salvar Links</button>
    <button id="runBtn">Executar Agora</button>
  </div>
  <div class="row">
    <button id="timerBtn" class="green">Ativar Timer (2h)</button>
  </div>

  <label>Testar em URL única (opcional: link | telefone):</label>
  <div class="row">
    <input type="text" id="testUrl" placeholder="https://... | 5511999999999">
    <button id="testBtn" class="secondary">Testar</button>
  </div>

  <hr>
  <label><b>Integração n8n / WhatsApp</b></label>
  <label class="sub">URL para BUSCAR pedidos (GET) - retorna lista JSON de pedidos:</label>
  <input type="text" id="fetchUrl" value="https://var-hub-infobip-controller.hx8235.easypanel.host/api/jobs">
  <label class="sub">URL para ENVIAR resultado (POST) - dispara o WhatsApp:</label>
  <input type="text" id="postUrl" value="https://var-hub-infobip-controller.hx8235.easypanel.host/api/result">
  <label class="sub">Token da API (x-api-token):</label>
  <input type="text" id="token" value="samwell-midia">
  <div class="row" style="align-items:center;">
    <select id="pollMin">
      <option value="5">5 min</option>
      <option value="15">15 min</option>
      <option value="30">30 min</option>
      <option value="60">60 min</option>
    </select>
    <label class="check"><input type="checkbox" id="pollEnabled"> Busca automática</label>
  </div>
  <div class="row">
    <button id="saveN8nBtn" class="secondary">Salvar n8n</button>
    <button id="pollNowBtn" class="secondary">Buscar agora</button>
  </div>
  <div id="n8nStatus"></div>

  <div id="status">Carregando...</div>
  <div id="log"></div>
  <script src="popup.js"></script>
</body>
</html>
